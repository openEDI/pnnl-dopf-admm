[build-system]
requires = ["setuptools>=72.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pnnl-dopf-admm"
version = "0.1.0"
description = "OEDISI Distribution Optimal Power Flow Federate (DOPF) using relaxed ADMM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	"setuptools==72.1.0",
	"helics>=3.4.0",
	"helics-apps>=3.4.0",
	"pydantic",
	"python-multipart",
	"uvicorn",
	"fastapi",
	"pyarrow",
	"scipy",
	"cvxpy",
	"matplotlib",
	"seaborn",
	"numpy",
	"pandas",
	"networkx",
	"oedisi~=3.0",
	"distopf @ git+https://github.com/GRIDAPPSD/distopf.git@feature/enapp",
]

[project.scripts]
distopf-federate-server = "distopf_federate.server:main"
distopf-federate-sim = "distopf_federate.federate:main"

[project.optional-dependencies]
dev = [
	"black>=24.0.0",
	"ruff>=0.6.0",
]
test = [
	"pytest>=8.0.0",
	"pytest-cov>=5.0.0",
	"mypy>=1.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "E402"]
